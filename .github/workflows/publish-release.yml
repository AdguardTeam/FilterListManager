name: Publish release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually
        required: false
        type: string

permissions:
  contents: read

# Nothing is published until every package has been built: each deploy job
# needs all four build jobs. Publishing to crates.io cannot be undone, so a
# build that fails late must not leave the crates released on their own.
jobs:
  tag:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/tag-from-changelog.yml@master
    with:
      ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}
      team: corelibs
    permissions:
      contents: write

  resolve-images:
    needs: tag
    runs-on: [team-corelibs]
    outputs:
      macos: ${{ steps.kv.outputs.MACOS }}
      windows: ${{ steps.kv.outputs.WINDOWS }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-multi@master
        id: kv
        with:
          get: |
            MACOS=build-images/macos
            WINDOWS=build-images/windows

  # ── Cargo crates ──────────────────────────────────────────────

  prepare-cargo:
    name: Package crates
    needs: tag
    runs-on: [team-corelibs]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Package crates
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          output: 'type=local,dest=./cargo-output'
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
          content: |
            FROM registry.int.agrd.dev/library/rust:2 AS build
            ARG VERSION
            COPY . /src
            WORKDIR /src
            # The manifests carry no version, so set-version writes one in. The
            # path dependency needs a version too before it can be packaged; the
            # grep fails the build if the sed did not match the manifest.
            # Packaging both crates in one call lets the ffi crate resolve
            # adguard-flm locally, before it exists on crates.io.
            RUN cargo set-version --workspace "${VERSION}" \
             && sed -i -E "s|^(adguard-flm = \{ path = \"\.\./filter-list-manager\")|\1, version = \"=${VERSION}\"|" crates/ffi/Cargo.toml \
             && grep -q "^adguard-flm = .*version = \"=${VERSION}\"" crates/ffi/Cargo.toml \
             && cargo package -p adguard-flm -p adguard-flm-ffi --allow-dirty \
             && mkdir /out && cp target/package/*.crate /out/
            FROM scratch
            COPY --from=build /out/ /

      - name: Assemble cargo payload
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p cargo-payload

          cp cargo-output/adguard-flm-"${VERSION}".crate cargo-payload/
          cp cargo-output/adguard-flm-ffi-"${VERSION}".crate cargo-payload/

          jq -n --arg v "$VERSION" '[
            {
              name: "adguard-flm",
              version: $v,
              file: ("adguard-flm-" + $v + ".crate")
            },
            {
              name: "adguard-flm-ffi",
              version: $v,
              file: ("adguard-flm-ffi-" + $v + ".crate")
            }
          ]' > cargo-payload/publish-order.json

      - name: Upload cargo payload
        uses: actions/upload-artifact@v7
        with:
          name: cargo-payload
          path: cargo-payload
          if-no-files-found: error

  cargo-deploy:
    name: Publish crates
    needs: [prepare-cargo, build-apple, build-kmp, build-windows]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-cargo.yml@master
    with:
      team: corelibs
    permissions:
      contents: read
      id-token: write

  # ── Apple adapter ─────────────────────────────────────────────

  build-apple:
    needs: [tag, resolve-images]
    uses: ./.github/workflows/build-apple.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      macos-runner: ${{ needs.resolve-images.outputs.macos }}
    secrets: inherit

  apple-deploy-xcframework:
    name: Deploy Apple xcframework
    needs: [prepare-cargo, build-apple, build-kmp, build-windows]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-ak-generic.yml@master
    with:
      team: corelibs
      artifact-pattern: apple-xcframework
      ak-repo: apple-bin
    secrets: inherit

  apple-deploy-swiftpm:
    name: Deploy Apple SwiftPM
    needs: apple-deploy-xcframework
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-ak-swift.yml@master
    with:
      team: corelibs
      artifact-pattern: apple-swiftpm
      ak-repo: swift-pkgs
    secrets: inherit

  # ── KMP adapter ───────────────────────────────────────────────

  build-kmp:
    needs: [tag, resolve-images]
    uses: ./.github/workflows/build-kmp.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      macos-runner: ${{ needs.resolve-images.outputs.macos }}
    secrets: inherit

  kmp-deploy:
    name: Deploy KMP adapter
    needs: [prepare-cargo, build-apple, build-kmp, build-windows]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-ak-maven.yml@master
    with:
      team: corelibs
      artifact-pattern: kmp-maven-payload
      ak-repo: maven-internal
    secrets: inherit

  # ── Windows adapter ───────────────────────────────────────────

  build-windows:
    needs: [tag, resolve-images]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      windows-runner: ${{ needs.resolve-images.outputs.windows }}
    secrets: inherit

  # nuget.exe needs Windows, as in core-libs' windows-deploy.
  windows-deploy:
    name: Push Windows NuGet package
    needs: [resolve-images, prepare-cargo, build-apple, build-kmp, build-windows]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-images.outputs.windows }}
      - ephemeral-limit-memory-2048
      - ephemeral-limit-cpu-2
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: windows-nupkg
          path: nupkg

      - name: Push to Artifactory
        env:
          NUGET_SOURCE: ${{ vars.NUGET_REPO_URL }}/AdGuard.FilterListManager
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Get-ChildItem -Path nupkg -Filter *.nupkg -Recurse
          if (-not $packages) { throw 'No .nupkg in the windows-nupkg artifact' }
          foreach ($package in $packages) {
            & nuget push $package.FullName -Source $env:NUGET_SOURCE `
              -ApiKey "$($env:ARTIFACTORY_USER):$($env:ARTIFACTORY_API_KEY)" -SkipDuplicate
            if ($LASTEXITCODE -ne 0) { throw "nuget push failed for $($package.Name)" }
          }

  # ── Mirror and GitHub Release ─────────────────────────────────

  mirror-and-release:
    needs: [tag, cargo-deploy, apple-deploy-swiftpm, kmp-deploy, windows-deploy]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror-and-release.yml@master
    with:
      team: corelibs
      target_repo: AdguardTeam/FilterListManager
      tag: ${{ needs.tag.outputs.tag }}
      changelog: ${{ needs.tag.outputs.release-notes }}
      artifact_name: apple-xcframework
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write

  # Open a tracking issue in each downstream app repo (with the private-stripped
  # changelog) and announce to Slack as one Block Kit message. All of the issue
  # and Slack logic lives in the shared announce-release.yml, so this mirrors how
  # the sibling CoreLibs project announces -- only product, channel and targets
  # differ. Runs after the release is mirrored + created, reusing its URL.
  announce:
    name: Announce release
    needs: [tag, mirror-and-release]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/announce-release.yml@master
    with:
      product: FilterListManager
      version: ${{ needs.tag.outputs.version }}
      release_url: ${{ needs.mirror-and-release.outputs.release-url }}
      changelog: ${{ needs.tag.outputs.release-notes }}
      channel: '#rust-filter-library'
      targets: |
        [
          {"repo": "AdguardTeam/AdguardForAndroid", "assignee": "artemiv4nov", "platform": "Android"},
          {"repo": "AdguardTeam/AdguardForWindows", "assignee": "adbuker", "platform": "Windows"},
          {"repo": "AdguardTeam/AdguardForMac", "assignee": "vityevato", "platform": "Mac"},
          {"repo": "AdguardTeam/AdguardForiOS", "assignee": "artemiv4nov", "platform": "iOS"},
          {"repo": "AdguardTeam/CoreLibs", "assignee": "sfionov", "platform": "CLI"}
        ]
      team: corelibs
    secrets: inherit
