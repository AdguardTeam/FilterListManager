name: Publish release

description: >-
  Tags the release commit from the merged release PR and creates a
  GitHub Release with the changelog section.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually
        required: false
        type: string

jobs:
  tag:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/tag-from-changelog.yml@master
    with:
      ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}
      team: corelibs
    permissions:
      contents: write

  release:
    needs: tag
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-gh-release.yml@master
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
      body: ${{ needs.tag.outputs.changelog }}
      team: corelibs
    permissions:
      contents: write
