name: Publish release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish manually
        required: false
        type: string

jobs:
  tag:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/tag-from-changelog.yml@master
    with:
      ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.ref_name }}
      team: corelibs
    permissions:
      contents: write

  prepare-cargo:
    name: Package crates
    needs: tag
    runs-on: [team-corelibs]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Package crates
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          output: 'type=local,dest=./cargo-output'
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
          content: |
            FROM registry.int.agrd.dev/library/rust:2 AS build
            ARG VERSION
            COPY . /src
            WORKDIR /src
            RUN cargo ws version exact "${VERSION}" --force --no-git-commit --no-git-tag --yes \
             && cargo package -p adguard-flm --allow-dirty \
             && cargo package -p adguard-flm-ffi --allow-dirty \
             && mkdir /out && cp target/package/*.crate /out/
            FROM scratch
            COPY --from=build /out/ /

      - name: Assemble cargo payload
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p cargo-payload

          cp cargo-output/adguard-flm-"${VERSION}".crate cargo-payload/
          cp cargo-output/adguard-flm-ffi-"${VERSION}".crate cargo-payload/

          jq -n --arg v "$VERSION" '[
            {
              name: "adguard-flm",
              version: $v,
              file: ("adguard-flm-" + $v + ".crate")
            },
            {
              name: "adguard-flm-ffi",
              version: $v,
              file: ("adguard-flm-ffi-" + $v + ".crate")
            }
          ]' > cargo-payload/publish-order.json

      - name: Upload cargo payload
        uses: actions/upload-artifact@v7
        with:
          name: cargo-payload
          path: cargo-payload
          if-no-files-found: error

  cargo-deploy:
    name: Publish crates
    needs: prepare-cargo
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-cargo.yml@master
    with:
      team: corelibs
    permissions:
      contents: read
      id-token: write

  mirror-and-release:
    needs: [tag, cargo-deploy]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror-and-release.yml@master
    with:
      team: corelibs
      target_repo: AdguardTeam/FilterListManager
      tag: ${{ needs.tag.outputs.tag }}
      changelog: ${{ needs.tag.outputs.release-notes }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
    secrets: inherit
    permissions:
      actions: write
      contents: read
      id-token: write

  # Open a tracking issue in each downstream app repo (with the private-stripped
  # changelog) and announce to Slack as one Block Kit message. All of the issue
  # and Slack logic lives in the shared announce-release.yml, so this mirrors how
  # the sibling CoreLibs project announces -- only product, channel and targets
  # differ. Runs after the release is mirrored + created, reusing its URL.
  announce:
    name: Announce release
    needs: [tag, mirror-and-release]
    permissions:
      contents: read
      id-token: write
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/announce-release.yml@master
    with:
      product: FilterListManager
      version: ${{ needs.tag.outputs.version }}
      release_url: ${{ needs.mirror-and-release.outputs.release-url }}
      changelog: ${{ needs.tag.outputs.release-notes }}
      channel: '#rust-filter-library'
      targets: |
        [
          {"repo": "AdguardTeam/AdguardForAndroid", "assignee": "artemiv4nov", "platform": "Android"},
          {"repo": "AdguardTeam/AdguardForWindows", "assignee": "adbuker", "platform": "Windows"},
          {"repo": "AdguardTeam/AdguardForMac", "assignee": "vityevato", "platform": "Mac"},
          {"repo": "AdguardTeam/AdguardForiOS", "assignee": "artemiv4nov", "platform": "iOS"},
          {"repo": "AdguardTeam/CoreLibs", "assignee": "sfionov", "platform": "CLI"}
        ]
      team: corelibs
    secrets: inherit
